id: io.github.nolight132.uchan-music
branch: stable

runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: uchan-music
finish-args:
  - --socket=wayland # Permission needed to show the window
  - --socket=fallback-x11 # Permission needed to show the window on legacy windowing systems
  - --socket=pulseaudio # Play audio
  - --device=dri # GPU acceleration
  - --share=network # Internet access
  - --share=ipc
  - --filesystem=xdg-run/pipewire-0:ro # Spotify flatpak has this
  # Open With passes an arbitrary path as argv; a plain Exec launch (unlike a portal file-open)
  # gets no per-file bind mount, so reading it needs read access to the whole host.
  - --filesystem=host:ro
  # Discord presence talks to Discord's IPC socket in the host runtime dir: a native Discord
  # puts it at discord-ipc-0, a Flatpak Discord under app/com.discordapp.Discord, which has to
  # be created from our side so the bind exists before Discord starts.
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create

  # Session Bus Permissions (Same as Spotify flatpak):
  - --talk-name=org.gnome.SettingsDaemon.MediaKeys
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.kde.StatusNotifierWatcher

  # MPRIS media controls
  - --own-name=org.mpris.MediaPlayer2.uchan-music

modules:
  - name: uchan-music
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/uchan-music/cargo
        CARGO_NET_OFFLINE: 'true'
    sources:
      # Use source from GitHub:
      #- type: git
      #  url: https://github.com/sonorahq/sonora.git
      #  tag: v0.28.0

      # Use source from this machine:
      - type: dir
        path: ..
        skip:
        - .git
        - .direnv
        - .flatpak-builder
        - target
        - dist
        - result
        - vendor
        - flatpak/flatpak
        - flatpak/flatpak-repo

      # Sources to build with Cargo:
      - cargo-sources.json
    build-commands:
      # Symlink/move cargo/config to config.toml to fix deprecation warning
      - test -f cargo/config && mv cargo/config cargo/config.toml || true

      # Build directly - Cargo will automatically use $CARGO_HOME/config
      - cargo build --offline --locked --release --package uchan-music

      # Collect info as suggested by: https://v2.tauri.app/distribute/flatpak/
      # Install binary to /app/bin
      - install -Dm755 "target/release/uchan-music" /app/bin/uchan-music

      # Install desktop icons
      - for icon in assets/linux/icons/hicolor/*/apps/uchan-music.png; do install -Dm644 "$icon" "/app/share/icons/hicolor/$(basename "$(dirname "$(dirname "$icon")")")/apps/io.github.nolight132.uchan-music.png"; done
      - install -Dm644 assets/linux/uchan-music.svg /app/share/icons/hicolor/scalable/apps/io.github.nolight132.uchan-music.svg

      # Install Desktop File and AppData Metainfo
      - install -d /app/share/applications /app/share/metainfo
      - sed 's/^Icon=uchan-music$/Icon=io.github.nolight132.uchan-music/' assets/linux/uchan-music.desktop > /app/share/applications/io.github.nolight132.uchan-music.desktop
      - sed -e "s/@VERSION@/$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)/" -e "s/@DATE@/$(date -I)/" flatpak/io.github.nolight132.uchan-music.metainfo.xml > /app/share/metainfo/io.github.nolight132.uchan-music.metainfo.xml

      # Install licenses
      - install -Dm644 COPYING /app/share/licenses/io.github.nolight132.uchan-music/LICENSE
      - install -Dm644 THIRD-PARTY.md /app/share/licenses/io.github.nolight132.uchan-music/THIRD-PARTY.md
      - install -Dm644 assets/fonts/LICENSE.txt /app/share/licenses/io.github.nolight132.uchan-music/LICENSE.Inter
      - install -Dm644 assets/icons/LICENSE /app/share/licenses/io.github.nolight132.uchan-music/icons/LICENSE
      - for licence in assets/icons/*/LICENSE; do install -Dm644 "$licence" "/app/share/licenses/io.github.nolight132.uchan-music/icons/LICENSE.$(basename "$(dirname "$licence")")"; done
